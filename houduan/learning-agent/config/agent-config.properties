# Learning Agent Configuration
# ================================

# DeepSeek API Configuration
# API Key 请通过环境变量 DEEPSEEK_API_KEY 注入，勿在此写入真实密钥（会进入版本库）
llm.deepseek.api-key=${DEEPSEEK_API_KEY:}
llm.deepseek.base-url=https://api.deepseek.com
llm.deepseek.model=deepseek-flash

# Agent Behavior Settings
agent.name=Project Learning Assistant
agent.description=An AI assistant that helps learn and navigate the project structure

# Project Paths (relative to this config file's parent directory)
frontend.path=../qianduan
backend.path=../backend

# Capabilities
agent.capabilities.page_navigation=true
agent.capabilities.component_analysis=true
agent.capabilities.database_analysis=true
